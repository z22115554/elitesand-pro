name: Emergency remove v0.9.9.7 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v0.9.9.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE repos/${{ github.repository }}/releases/370165242
