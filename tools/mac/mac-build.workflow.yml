# macOS 測試版打包流程。放在公開倉（elitesand-pro）的 .github/workflows/mac-build.yml：
# 公開倉的 GitHub Actions 不計算私人額度，macOS runner 免費。
# 這份檔案在私人倉只是範本（tools/ 不會觸發 Actions），發布時複製到公開倉的 mac-beta 分支。
#
# 產物只上傳成 Actions artifact，刻意「不」建立 GitHub Release：App 的更新檢查會把
# 公開倉的 prerelease 也當成候選版本，發 Mac 測試版 Release 會讓 Windows 使用者跳更新。
name: macOS beta build

on:
  push:
    branches: [mac-beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: macOS unit tests
        run: node --test tests/macos-support.test.js tests/mac-beta-diagnostics.test.js tests/mac-ai-separation.test.js
      - name: Build, verify and boot-check the app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ELITESAND_BUILD_LABEL: beta.${{ github.run_number }}
        run: node tools/build-mac.js --arch ${{ matrix.arch }}
      - name: Runtime smoke (bundled yt-dlp/node, in-app FFmpeg download, transcode)
        run: |
          APP=$(ls -d dist/releases/v*/mac-${{ matrix.arch }}/builder/*/"Elitesand Pro.app" | head -1)
          node tools/mac/smoke-runtime.js "$APP"
      # Apple Silicon 才有 AI 人聲分離：用 app 自己的安裝流程裝元件包（驗雜湊），對 15 秒的合成
      # 音訊真的分離一次，再對分離出的人聲跑練唱音高線。arm64 上必須通過；Intel 版不支援、不跑。
      # Kim 主模型（約 870MB）用 cache，Python 與套件每次都照 app 的流程重新下載與驗證。
      - name: Cache AI separation model (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/ai-smoke/ai-models
          key: mac-ai-model-${{ hashFiles('server/services/primary-model-download.js') }}
      - name: AI separation + practice pitch smoke (arm64)
        if: matrix.arch == 'arm64'
        timeout-minutes: 40
        run: node tools/mac/smoke-ai.js "${{ runner.temp }}/ai-smoke" "${{ runner.temp }}/ai-smoke.json"
      - name: Record AI smoke result in build info
        if: always()
        run: |
          INFO=$(ls dist/releases/v*/mac-${{ matrix.arch }}/BUILD-INFO.txt 2>/dev/null | head -1 || true)
          if [ "${{ matrix.arch }}" = "arm64" ] && [ -f "${{ runner.temp }}/ai-smoke.json" ]; then
            RESULT=$(cat "${{ runner.temp }}/ai-smoke.json")
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            RESULT='AI smoke did not produce a report'
          else
            RESULT='Not run: AI vocal separation and the practice pitch line are Apple Silicon only (the app shows "not supported" on Intel Macs).'
          fi
          printf '\nAI separation smoke (%s):\n%s\n' "${{ matrix.arch }}" "$RESULT" | tee -a "${INFO:-/dev/null}" >> "$GITHUB_STEP_SUMMARY"
      - name: Locate DMG
        id: dmg
        run: echo "path=$(ls dist/releases/v*/mac-${{ matrix.arch }}/*.dmg | head -1)" >> "$GITHUB_OUTPUT"
      # 第一次開啟小工具：模擬從網路下載（加上 quarantine）後掛載 DMG，記錄 Gatekeeper 對 app 與
      # 小工具的評估，並對拖進「應用程式」的那份 app 實際執行小工具，確認隔離屬性被移除。
      - name: First-launch helper check (quarantined DMG)
        run: |
          bash tools/mac/smoke-first-launch.sh "${{ steps.dmg.outputs.path }}" "${{ runner.temp }}/first-launch.txt"
          INFO=$(ls dist/releases/v*/mac-${{ matrix.arch }}/BUILD-INFO.txt | head -1)
          printf '\nFirst-launch helper (%s):\n' "${{ matrix.arch }}" | tee -a "$INFO" >> "$GITHUB_STEP_SUMMARY"
          tee -a "$INFO" < "${{ runner.temp }}/first-launch.txt" >> "$GITHUB_STEP_SUMMARY"
      # archive: false → 測試人員下載到的就是 .dmg 本身，不會再包一層 zip。
      # 這個模式一次只能傳一個檔案，所以雜湊與建置資訊另外傳一個小的 artifact。
      - name: Upload DMG (not zipped)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.dmg.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Upload checksum and build info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info-mac-${{ matrix.arch }}-beta.${{ github.run_number }}
          path: |
            dist/releases/v*/mac-${{ matrix.arch }}/*.dmg.sha256
            dist/releases/v*/mac-${{ matrix.arch }}/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 90
