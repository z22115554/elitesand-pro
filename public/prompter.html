<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B141F">
  <title data-i18n="app.prompterTitle">Elitesand Pro 跟唱視圖</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/prompter.css">
</head>
<body class="prompter">
  <div id="connection-banner" class="connection-banner" data-i18n="status.reconnecting">與伺服器連線中斷，重新連線中…</div>

  <header class="pt-top">
    <span class="pt-brand">Elitesand Pro <span class="pt-brand-sub" data-i18n="prompter.name">跟唱視圖</span></span>
    <div class="pt-top-right">
      <select class="locale-select" data-i18n-locale data-i18n-skip aria-label="介面語言">
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="zh-CN">简体中文</option>
      </select>
      <span class="conn">
        <span id="connection-status" class="status-dot disconnected"></span>
        <span id="connection-text" data-i18n="status.connecting">連線中</span>
      </span>
      <button id="pt-settings-btn" class="pt-icon-btn" type="button" title="歌詞外觀設定" aria-label="歌詞外觀設定" data-i18n-title="prompter.appearance" data-i18n-aria-label="prompter.appearance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="pt-theme-toggle" class="theme-toggle" type="button" title="切換主題" aria-label="切換主題" data-i18n-title="theme.switch" data-i18n-aria-label="theme.switch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="pt-body">
    <aside class="pt-side">
      <div class="pt-side-head" data-i18n="playlist.title">播放清單</div>
      <div id="pt-playlist" class="pt-playlist">
        <div class="pt-playlist-empty" data-i18n="prompter.playlistEmpty">尚無歌曲</div>
      </div>
    </aside>

    <main class="pt-lyrics-pane">
      <div id="pt-lyrics" class="pt-lyrics">
        <div class="pt-lyrics-empty" data-i18n="player.noTrack">尚未播放</div>
      </div>
    </main>
  </div>

  <footer class="pt-transport">
    <div class="pt-np">
      <div id="pt-np-title" class="pt-np-title" data-i18n="player.noTrack">尚未播放</div>
      <div id="pt-np-artist" class="pt-np-artist"></div>
    </div>
    <div class="pt-transport-controls">
      <button id="pt-btn-prev" class="pt-step" type="button" aria-label="上一首" data-i18n-aria-label="player.previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-9-6z"/></svg>
      </button>
      <button id="pt-btn-play" class="pt-play" type="button" aria-label="播放或暫停" data-i18n-aria-label="player.playPause"><span id="pt-play-icon">▶</span></button>
      <button id="pt-btn-next" class="pt-step" type="button" aria-label="下一首" data-i18n-aria-label="player.next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg>
      </button>
    </div>
    <div class="pt-progress">
      <span id="pt-time-current" class="pt-time">0:00</span>
      <div id="pt-progress-track" class="pt-progress-track" role="slider" tabindex="0" aria-label="播放進度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" data-i18n-aria-label="prompter.progress">
        <div id="pt-progress-fill" class="pt-progress-fill"></div>
        <div class="pt-progress-thumb" aria-hidden="true"></div>
      </div>
      <span id="pt-time-total" class="pt-time">0:00</span>
    </div>
  </footer>

  <!-- 歌詞外觀設定：只存這台裝置的 localStorage，不是伺服器 state.json 的一部分——
       純粹是「這台螢幕看起來要多大多粗」的個人偏好，不影響 OBS 或其他裝置。 -->
  <div id="pt-settings-modal" class="modal" hidden>
    <div class="modal-card modal-card--compact">
      <div class="modal-head">
        <h3 data-i18n="prompter.appearance">歌詞外觀</h3>
        <button id="pt-settings-close" class="btn btn-sm btn-ghost" type="button" data-i18n="common.close">關閉</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="pt-set-font" data-i18n="prompter.font">字體</label>
          <select id="pt-set-font" class="input">
            <optgroup id="pt-font-presets" label="內建字體" data-i18n-label="prompter.builtInFonts">
              <option value="default" data-i18n="prompter.fontDefault">預設（圓體）</option>
              <option value="serif" data-i18n="prompter.fontSerif">襯線</option>
              <option value="mono" data-i18n="prompter.fontMono">等寬</option>
              <option value="system" data-i18n="prompter.fontSystem">系統無襯線</option>
            </optgroup>
            <optgroup id="pt-font-local" label="本機字體" data-i18n-label="prompter.localFonts"></optgroup>
          </select>
          <p id="pt-font-status" class="field-hint" role="status" aria-live="polite" data-i18n="prompter.fontLoading">開啟設定時會讀取這台電腦已安裝的字體。</p>
        </div>
        <div class="field">
          <label><span data-i18n="prompter.fontSize">字級</span> <span id="pt-set-size-val" class="val">27px</span></label>
          <input id="pt-set-size" type="range" min="16" max="52" step="1" value="27">
        </div>
        <div class="field field-row">
          <div class="flex-grow">
            <label for="pt-set-color" data-i18n="prompter.textColor">文字顏色</label>
            <input id="pt-set-color" type="color" value="#f2f3f5">
          </div>
          <div class="flex-grow">
            <label for="pt-set-stroke-c" data-i18n="prompter.strokeColor">描邊顏色</label>
            <input id="pt-set-stroke-c" type="color" value="#000000">
          </div>
        </div>
        <div class="field">
          <label><span data-i18n="prompter.strokeWidth">描邊寬度</span> <span id="pt-set-stroke-w-val" class="val">0px</span></label>
          <input id="pt-set-stroke-w" type="range" min="0" max="4" step="0.5" value="0">
        </div>
        <button id="pt-set-reset" class="btn btn-sm btn-ghost" type="button" data-i18n="prompter.resetAppearance">重置為預設</button>
      </div>
    </div>
  </div>

  <!-- PIN 保護：伺服器設定 PIN 後，連線被拒會跳出這個要求輸入的視窗（見 public/js/pin-auth.js） -->
  <div id="pin-required-modal" class="modal" hidden>
    <div class="modal-card modal-card--compact">
      <div class="modal-head"><h3 data-i18n="pin.required">需要 PIN</h3></div>
      <div class="modal-body">
        <p class="field-hint modal-form-hint" data-i18n="pin.deviceHint">這台裝置需要輸入 PIN 才能操作 Elitesand Pro。</p>
        <input id="pin-required-input" class="input modal-form-input" type="password" inputmode="numeric" autocomplete="off" placeholder="輸入 PIN" data-i18n-placeholder="pin.placeholder">
        <div id="pin-required-error" class="modal-error modal-error--spaced"></div>
        <button id="pin-required-submit" class="btn btn-primary modal-submit" type="button" data-i18n="common.confirm">確認</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared-utils.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/pin-auth.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/playlist-state.js"></script>
  <script src="/js/prompter.js"></script>
</body>
</html>
