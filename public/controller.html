<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B141F">
  <title data-i18n="app.remoteTitle">Elitesand Pro 遙控器</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/controller-new.css">
</head>
<body class="controller">
  <div id="connection-banner" class="connection-banner" data-i18n="status.reconnecting">與伺服器連線中斷，重新連線中…</div>

  <div class="ctrl-top">
    <span class="brand">Elitesand Pro</span>
    <div class="right">
      <span class="conn">
        <span id="connection-status" class="status-dot disconnected"></span>
        <span id="connection-text" data-i18n="status.connecting">連線中</span>
      </span>
      <select class="locale-select" data-i18n-locale aria-label="介面語言">
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="zh-CN">简体中文</option>
      </select>
      <button class="theme-toggle" type="button" title="切換主題" aria-label="切換主題" data-i18n-title="theme.switch" data-i18n-aria-label="theme.switch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="ctrl-np">
    <div id="album-art" class="cover"></div>
    <div>
      <div id="track-title" class="title" data-i18n="player.noTrack">尚未播放</div>
      <div id="track-artist" class="artist"></div>
    </div>
  </div>

  <div class="ctrl-progress">
    <div id="progress-track" class="track">
      <div id="progress-fill" class="fill"></div>
    </div>
    <div class="times">
      <span id="time-current">0:00</span>
      <span id="time-total">0:00</span>
    </div>
  </div>

  <div class="ctrl-transport">
    <button id="btn-prev" class="step" type="button" aria-label="上一首" data-i18n-aria-label="player.previous">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-9-6z"/></svg>
    </button>
    <button id="btn-play" class="play" type="button" aria-label="播放或暫停" data-i18n-aria-label="player.playPause"><span id="play-icon">▶</span></button>
    <button id="btn-next" class="step" type="button" aria-label="下一首" data-i18n-aria-label="player.next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg>
    </button>
  </div>

  <button id="btn-emergency" class="ctrl-emergency" type="button" data-i18n="controller.emergency">緊急隱藏歌詞</button>

  <div class="ctrl-card">
    <p class="eyebrow" data-i18n="controller.offset">歌詞時間偏移</p>
    <div class="ctrl-offset">
      <button id="offset-minus05" type="button">−0.5s</button>
      <button id="offset-minus01" type="button">−0.1s</button>
      <button id="offset-reset" type="button" data-i18n="common.resetZero">歸零</button>
      <button id="offset-plus01" type="button">+0.1s</button>
      <button id="offset-plus05" type="button">+0.5s</button>
      <span id="offset-display" class="disp">0.0s</span>
    </div>
  </div>

  <div class="ctrl-card">
    <p class="eyebrow" data-i18n="controller.languageDisplay">語言顯示</p>
    <div class="ctrl-chips">
      <button class="ctrl-mode-btn active" data-mode="original" type="button" data-i18n="controller.original">原文</button>
      <button class="ctrl-mode-btn" data-mode="romanized" type="button" data-i18n="controller.romanized">拼音</button>
      <button class="ctrl-mode-btn" data-mode="both" type="button" data-i18n="controller.originalRomanized">原文+拼音</button>
      <button class="ctrl-mode-btn" data-mode="xieyin" type="button" data-i18n="controller.originalPhonetic">原文+諧音</button>
      <button class="ctrl-mode-btn" data-mode="full" type="button" data-i18n="common.all">全部</button>
    </div>
  </div>

  <div class="ctrl-card">
    <p class="eyebrow" data-i18n="controller.lyricTemplate">歌詞模板</p>
    <div class="ctrl-chips ctrl-template-chips">
      <button class="ctrl-template-btn active" data-template="classic" type="button" data-i18n="template.classic">經典疊層</button>
      <button class="ctrl-template-btn" data-template="pulse" type="button" data-i18n="template.pulse">星砂流光</button>
      <button class="ctrl-template-btn" data-template="facet" type="button" data-i18n="template.facet">折光階梯</button>
      <button class="ctrl-template-btn" data-template="drift" type="button" hidden aria-hidden="true" data-i18n="template.drift">斜拍告白</button>
      <button class="ctrl-template-btn" data-template="aura" type="button" data-i18n="template.aura">潮汐心景</button>
      <button class="ctrl-template-btn" data-template="ktv" type="button" data-i18n="template.ktv">霓彩伴唱</button>
      <button class="ctrl-template-btn" data-template="columnflow" type="button" data-i18n="template.columnflow">直書句流</button>
    </div>
    <div id="ctrl-lyric-position-group">
      <p class="ctrl-sub-label" data-i18n="controller.position">位置</p>
      <div class="ctrl-chips">
        <button class="ctrl-position-btn active" data-position="center" type="button" data-i18n="controller.center">置中</button>
        <button class="ctrl-position-btn" data-position="left" type="button" data-i18n="controller.left">偏左</button>
        <button class="ctrl-position-btn" data-position="right" type="button" data-i18n="controller.right">偏右</button>
        <button class="ctrl-position-btn" data-position="split" type="button" data-i18n="controller.split">左右分散</button>
      </div>
    </div>
    <div id="ctrl-columnflow-variant-group" hidden>
      <p class="ctrl-sub-label" data-i18n="controller.columnStyle">直書句流樣式</p>
      <div class="ctrl-chips">
        <button class="ctrl-columnflow-variant-btn active" data-columnflow-variant="sen" type="button" data-i18n="template.columnSen">素筆直書</button>
        <button class="ctrl-columnflow-variant-btn" data-columnflow-variant="fuda" type="button" data-i18n="template.columnFuda">字札直書</button>
      </div>
    </div>
    <div id="ctrl-columnflow-placement-group" hidden>
      <p class="ctrl-sub-label" data-i18n="controller.columnPosition">直書位置</p>
      <div class="ctrl-chips">
        <button class="ctrl-columnflow-placement-btn" data-columnflow-placement="left" type="button" data-i18n="controller.left">偏左</button>
        <button class="ctrl-columnflow-placement-btn" data-columnflow-placement="right" type="button" data-i18n="controller.right">偏右</button>
        <button class="ctrl-columnflow-placement-btn active" data-columnflow-placement="split" type="button" data-i18n="controller.split">左右分散</button>
      </div>
    </div>
    <div id="ctrl-columnflow-max-lines-group" hidden>
      <p class="ctrl-sub-label" data-i18n="controller.retainedLines">同時保留句數</p>
      <div class="ctrl-chips">
        <button class="ctrl-columnflow-max-lines-btn" data-columnflow-max-lines="1" type="button">1</button>
        <button class="ctrl-columnflow-max-lines-btn" data-columnflow-max-lines="2" type="button">2</button>
        <button class="ctrl-columnflow-max-lines-btn" data-columnflow-max-lines="3" type="button">3</button>
        <button class="ctrl-columnflow-max-lines-btn active" data-columnflow-max-lines="4" type="button">4</button>
        <button class="ctrl-columnflow-max-lines-btn" data-columnflow-max-lines="5" type="button">5</button>
        <button class="ctrl-columnflow-max-lines-btn" data-columnflow-max-lines="6" type="button">6</button>
      </div>
    </div>
    <div id="ctrl-intensity-group">
      <p class="ctrl-sub-label" data-i18n="controller.intensity">動態強度</p>
      <div class="ctrl-chips">
        <button class="ctrl-intensity-btn" data-intensity="calm" type="button" data-i18n="controller.calm">靜</button>
        <button class="ctrl-intensity-btn active" data-intensity="normal" type="button" data-i18n="controller.normal">中</button>
        <button class="ctrl-intensity-btn" data-intensity="chaotic" type="button" data-i18n="controller.strong">強</button>
      </div>
    </div>
    <div class="ctrl-preset-row">
      <select id="ctrl-lyric-preset" class="input" aria-label="歌詞外觀預設" data-i18n-aria-label="controller.lyricPresetLabel"><option value="" data-i18n="controller.noPreset">尚未保存預設</option></select>
      <button id="ctrl-lyric-preset-apply" class="btn btn-sm" type="button" data-i18n="common.apply">套用</button>
    </div>
  </div>

  <div class="ctrl-card" id="ctrl-classic-style-group">
    <p class="eyebrow" data-i18n="controller.classicPalette">配色風格（經典疊層）</p>
    <div class="ctrl-chips">
      <button class="ctrl-style-btn active" data-style="cute" type="button" data-i18n="controller.cute">可愛</button>
      <button class="ctrl-style-btn" data-style="rock" type="button" data-i18n="controller.rock">搖滾</button>
      <button class="ctrl-style-btn" data-style="ballad" type="button" data-i18n="controller.ballad">抒情</button>
    </div>
  </div>

  <div class="ctrl-card">
    <p class="eyebrow" data-i18n="controller.pitchSpeed">變調 / 變速</p>
    <div class="ctrl-stepper-row">
      <span class="lbl" data-i18n="controller.pitch">變調</span>
      <div class="ctrl-stepper">
        <button id="ctrl-pitch-down" class="ctrl-stepper-btn" type="button" aria-label="降一個半音" data-i18n-aria-label="controller.pitchDown">−</button>
        <span id="ctrl-pitch-value" class="ctrl-stepper-val">0</span>
        <button id="ctrl-pitch-up" class="ctrl-stepper-btn" type="button" aria-label="升一個半音" data-i18n-aria-label="controller.pitchUp">+</button>
      </div>
      <button id="ctrl-pitch-reset" class="btn btn-sm btn-ghost" type="button" data-i18n="common.reset">重置</button>
      <input id="ctrl-pitch-slider" type="range" min="-12" max="12" step="1" value="0" hidden>
    </div>
    <div class="ctrl-stepper-row">
      <span class="lbl" data-i18n="controller.speed">變速</span>
      <div class="ctrl-stepper">
        <button id="ctrl-speed-down" class="ctrl-stepper-btn" type="button" aria-label="減速" data-i18n-aria-label="controller.slower">−</button>
        <span id="ctrl-speed-value" class="ctrl-stepper-val">1.00x</span>
        <button id="ctrl-speed-up" class="ctrl-stepper-btn" type="button" aria-label="加速" data-i18n-aria-label="controller.faster">+</button>
      </div>
      <button id="ctrl-speed-reset" class="btn btn-sm btn-ghost" type="button" data-i18n="common.reset">重置</button>
      <input id="ctrl-speed-slider" type="range" min="0.5" max="1.5" step="0.05" value="1" hidden>
    </div>
    <div class="ctrl-switch-row">
      <span data-i18n="controller.introCountdown">前奏倒數提示</span>
      <label class="switch"><input id="ctrl-metronome-toggle" type="checkbox" checked><span class="track"></span></label>
    </div>
  </div>

  <div class="ctrl-card">
    <p class="eyebrow" data-i18n="controller.lyrics">歌詞</p>
    <div class="ctrl-lyric-btns">
      <button id="btn-lyrics-paste" class="btn" type="button" data-i18n="controller.pasteLyrics">貼上歌詞</button>
      <button id="btn-lyrics-drop" class="btn btn-ghost" type="button" data-i18n="controller.uploadFile">上傳檔案</button>
      <input id="lyrics-file-input" type="file" accept=".lrc,.srt,.txt" hidden>
    </div>
  </div>

  <div class="ctrl-card">
    <button id="playlist-toggle" class="ctrl-playlist-toggle" type="button">
      <span data-i18n="controller.playlist">播放清單</span>
      <span id="toggle-arrow" class="arrow">▾</span>
    </button>
    <div id="playlist" class="ctrl-playlist">
      <div class="ctrl-playlist-empty"><div data-i18n="controller.emptyPlaylist">尚無歌曲</div><div class="hint" data-i18n="controller.addFromPanel">請從控制面板新增歌曲</div></div>
    </div>
  </div>

  <div id="lyrics-paste-modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 data-i18n="controller.pasteLyrics">貼上歌詞</h3>
        <button id="lyrics-paste-cancel" class="btn btn-sm btn-ghost" type="button" data-i18n="common.cancel">取消</button>
      </div>
      <div class="modal-body">
        <textarea id="lyrics-paste-textarea" class="input modal-lyrics-textarea" placeholder="貼上 LRC 或純文字歌詞…" data-i18n-placeholder="controller.pastePlaceholder"></textarea>
        <button id="lyrics-paste-confirm" class="btn btn-primary modal-submit modal-submit--spaced" type="button" data-i18n="controller.applyLyrics">套用歌詞</button>
      </div>
    </div>
  </div>

  <div id="ctrl-toast" class="toast"></div>

  <!-- PIN 保護：伺服器設定 PIN 後，連線被拒會跳出這個要求輸入的視窗（見 public/js/pin-auth.js） -->
  <div id="pin-required-modal" class="modal" hidden>
    <div class="modal-card modal-card--compact">
      <div class="modal-head"><h3 data-i18n="pin.required">需要 PIN</h3></div>
      <div class="modal-body">
        <p class="field-hint modal-form-hint" data-i18n="pin.deviceHint">這台裝置需要輸入 PIN 才能操作 Elitesand Pro。</p>
        <input id="pin-required-input" class="input modal-form-input" type="password" inputmode="numeric" autocomplete="off" placeholder="輸入 PIN" data-i18n-placeholder="pin.placeholder">
        <div id="pin-required-error" class="modal-error modal-error--spaced"></div>
        <button id="pin-required-submit" class="btn btn-primary modal-submit" type="button" data-i18n="common.confirm">確認</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared-utils.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/pin-auth.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/playlist-state.js"></script>
  <script src="/js/styles.js"></script>
  <script src="/js/error-handler.js"></script>
  <script src="/js/controller.js"></script>
</body>
</html>
