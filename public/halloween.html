<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>萬聖節活動</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/halloween.css">
</head>
<body data-activity="pending">
  <!-- OBS 萬聖節活動疊加：透明背景。?part=cauldron（舊網址 ?part=pumpkin 也可）只顯示大鍋、?part=treats 只顯示名牌、
       ?part=fx 只顯示觀眾互動特效，預設全部顯示。 -->
  <div id="treat-string" class="treat-string" aria-live="polite"></div>

  <!-- 進度區（class 沿用南瓜燈時代的 pumpkin-*，版面、大小滑桿、感謝提示與慶祝共用） -->
  <section id="halloween-panel" class="pumpkin-panel">
   <div class="pumpkin-cluster">
    <div id="halloween-thanks" class="pumpkin-thanks" aria-live="polite"></div>
    <div id="cauldron-wrap" class="pumpkin-wrap cauldron-wrap">
      <div id="halloween-burst" class="pumpkin-burst" aria-hidden="true"></div>
      <!-- 液體在最底層，鍋子（美術圖或保底 SVG）疊在上面，液體只從挖空的鍋口透出來。
           兩者包在同一個 .cauldron-body 裡，抖動／彈跳時湯跟著鍋子一起動。 -->
      <div class="cauldron-body">
        <canvas id="cauldron-liquid" class="cauldron-liquid" aria-hidden="true"></canvas>
        <div class="cauldron-art" aria-hidden="true"></div>
        <svg class="cauldron-svg" viewBox="0 0 600 600" aria-hidden="true">
          <!-- 保底大鍋：鍋口橢圓（300, 131.4, 191.3×41.6）與美術圖 cauldron.webp 的開口一致。 -->
          <g class="cauldron-svg-fire">
            <path d="M215 520 Q228 470 255 455 Q248 490 270 500 Q262 465 300 430 Q300 480 322 492 Q330 465 350 455 Q378 480 385 520 Z"/>
          </g>
          <path class="cauldron-svg-legs" d="M140 455 L120 520 L165 505 Z M460 455 L480 520 L435 505 Z"/>
          <path class="cauldron-svg-body" fill-rule="evenodd"
            d="M300 95 C430 95 520 118 520 150 C560 200 570 290 540 380 C510 470 410 500 300 500 C190 500 90 470 60 380 C30 290 40 200 80 150 C80 118 170 95 300 95 Z
               M300 89.8 C194.4 89.8 108.7 108.4 108.7 131.4 C108.7 154.4 194.4 173 300 173 C405.6 173 491.3 154.4 491.3 131.4 C491.3 108.4 405.6 89.8 300 89.8 Z"/>
          <ellipse class="cauldron-svg-rim" cx="300" cy="131.4" rx="203" ry="50"/>
        </svg>
      </div>
      <div id="cauldron-potion" class="cauldron-potion" aria-live="polite"></div>
    </div>
    <div class="pumpkin-text">
      <div id="halloween-title" class="pumpkin-title">魔女的大鍋</div>
      <div class="pumpkin-amount">
        <span id="halloween-currency" class="pumpkin-currency">NT$</span><span id="halloween-total">0</span>
        <span class="pumpkin-sep">/</span><span id="halloween-goal">5,000</span><span id="halloween-unit" class="pumpkin-unit"></span>
      </div>
      <div id="cauldron-top" class="cauldron-top"></div>
      <div id="halloween-done" class="pumpkin-done" hidden>大鍋滿了，謝謝大家！</div>
    </div>
   </div>
  </section>

  <!-- 觀眾互動特效：!treat／!trick 飄過的糖果與小幽靈、搗蛋獎勵的幽靈、抽獎揭曉。?part=fx 只顯示這層。 -->
  <div id="halloween-fx" class="fx-layer" aria-live="polite"></div>

  <!-- 謝幕名單：只在 ?part=credits 顯示，面板按「播放」才捲一次（?autoplay=1 載入即播） -->
  <section class="pumpkin-credits" aria-hidden="true">
    <div id="halloween-credits-roll" class="pumpkin-credits-roll"></div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/access-auth.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/obs-locale-follow.js"></script>
  <script src="/js/seasonal-overlay.js"></script>
  <script src="/js/halloween-art.js"></script>
  <script src="/js/halloween.js"></script>
</body>
</html>
